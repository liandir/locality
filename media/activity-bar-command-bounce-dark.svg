<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <style>
    .busy-icon { animation: icon-bounce 0.95s ease-in-out infinite; }
    @keyframes icon-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @media (prefers-reduced-motion: reduce) { .busy-icon { animation: none; } }
  </style>
  <g class="busy-icon">
    <g stroke="#f0f0f0" stroke-width="3"><circle cx="24" cy="24" r="10"/><circle cx="24" cy="24" r="20" stroke-opacity=".5"/></g><circle cx="24" cy="24" r="3.5" fill="#f0f0f0"/>
  </g>
</svg>

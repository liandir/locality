<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#424242" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .busy-icon { animation: icon-bounce 0.95s ease-in-out infinite; }
    @keyframes icon-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @media (prefers-reduced-motion: reduce) { .busy-icon { animation: none; } }
  </style>
  <g class="busy-icon">
    <circle cx="12" cy="12" r="9.25" stroke-opacity="0.45"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.75" fill="#424242" stroke="none"/>
  </g>
</svg>

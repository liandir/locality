name: Release VSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-vsix:
    name: Release VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Package VSIX
        run: npm run package:vsix

      - name: Prepare stable release filenames
        run: |
          node --input-type=module <<'NODE'
          import { copyFile, mkdir, readFile, rm } from "node:fs/promises";
          import { profiles } from "./scripts/build-profiles.mjs";

          const { name, version } = JSON.parse(await readFile("package.json", "utf8"));
          const output = ".build/release-assets";
          await rm(output, { recursive: true, force: true });
          await mkdir(output, { recursive: true });
          for (const profile of profiles) {
            await copyFile(`artifacts/${name}-${version}-${profile}.vsix`, `${output}/${name}-${profile}.vsix`);
          }
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" .build/release-assets/*.vsix --clobber
          else
            gh release create "${GITHUB_REF_NAME}" .build/release-assets/*.vsix \
              --title "${GITHUB_REF_NAME}" \
              --notes "VS Code extension package for Locality."
          fi
